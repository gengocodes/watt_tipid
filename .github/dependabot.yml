version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # Block semver-major updates to TypeScript because typescript-eslint
      # and eslint-config-next may not support the new major yet.
      # Patch and minor releases continue to update automatically.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # Block semver-major updates to ESLint because peer plugins
      # (eslint-plugin-react, eslint-plugin-jsx-a11y, eslint-plugin-import)
      # may lag behind. Patch/minor releases continue to update automatically.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
